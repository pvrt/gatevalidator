name: Check and Update Proxies

on:
  schedule:
    # Запуск каждые 30 минут
    - cron: '*/30 * * * *'
  workflow_dispatch: # Позволяет запускать вручную из вкладки Actions

permissions:
  contents: write

jobs:
  validate-proxies:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Proxy Checker
        run: |
          python check_proxies.py

      - name: Commit and Push if Changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add valid_proxies.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update valid proxies [skip ci]" && git push)